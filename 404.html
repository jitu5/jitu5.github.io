<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <script type="text/javascript">
      // Redirect script for GitHub Pages SPA
      (function() {
        var redirectTo = '/' + location.pathname.substring(1);
        window.location.replace(redirectTo);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
