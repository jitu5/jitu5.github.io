<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Single Page Apps for GitHub Pages</title>
    // In 404.html
    // In 404.html
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      
      // Only redirect if we haven't already been redirected (prevents loops)
      if (!sessionStorage.getItem('redirect-lock')) {
        // Save that we're redirecting to prevent loops
        sessionStorage.setItem('redirect-lock', 'true');
    
        // Build base URL (e.g. https://jitu5.github.io)
        var baseUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
    
        // Keep pathSegmentsToKeep number of segments for GitHub Pages
        var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
    
        // Convert remaining path to hash route
        var hashRoute = '#' + l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/');
        
        // Redirect preserving any query params
        l.replace(
          baseUrl + repoPath + hashRoute + (l.search ? '?' + l.search.slice(1) : '')
        );
      } else {
        // Clear the redirect lock so future legitimate redirects can happen
        sessionStorage.removeItem('redirect-lock');
      }
    </script>
  </head>

</html>
