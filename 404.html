<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Single Page Apps for GitHub Pages</title>
    // In 404.html
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
    
      // Store the URL we're trying to reach
      var redirectUrl = sessionStorage.getItem('redirectUrl');
      
      if (!redirectUrl) {
        // First time - store the original URL and redirect to base
        sessionStorage.setItem('redirectUrl', l.pathname + l.search + l.hash);
        
        // Redirect to base URL
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')
        );
      } else {
        // Second time - restore the URL
        sessionStorage.removeItem('redirectUrl');
        l.replace(redirectUrl);
      }
    </script>
  </head>
  <body>
  </body>
</html>
